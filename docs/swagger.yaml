basePath: /api/
definitions:
  response.ErrorResponse:
    properties:
      details: {}
      message:
        type: string
      status:
        type: integer
    type: object
  subscription.SubscriptionCreateDTO:
    properties:
      end_date:
        type: string
      price:
        type: integer
      service_name:
        maxLength: 64
        type: string
      start_date:
        type: string
      user_id:
        type: string
    required:
    - price
    - service_name
    - start_date
    - user_id
    type: object
  subscription.SubscriptionResponseDTO:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      price:
        type: integer
      service_name:
        type: string
      start_date:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  subscription.SubscriptionUpdateDTO:
    properties:
      end_date:
        type: string
      price:
        type: integer
      service_name:
        maxLength: 64
        type: string
      start_date:
        type: string
    required:
    - price
    - service_name
    - start_date
    type: object
info:
  contact: {}
paths:
  /subscriptions:
    get:
      consumes:
      - application/json
      description: Возвращает список подписок с возможностью фильтртации, пагинации
        и сортировки
      parameters:
      - description: Фильтр по ID пользователя (UUID)
        in: query
        name: user_id
        type: string
      - description: Фильтр по названию сервиса
        in: query
        name: service_name
        type: string
      - description: Фильтр по дате начала подписки (ММ-ГГГГ)
        in: query
        name: start_date
        type: string
      - description: Фильтр по дате окончания подписки (ММ-ГГГГ)
        in: query
        name: end_date
        type: string
      - description: Количество получаемых записей (по умолчанию 50)
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      - description: Отступ (по умолчанию 0)
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Поле для сортировки
        enum:
        - start_date
        - end_date
        - price
        - created_at
        in: query
        name: sort_by
        type: string
      - description: Порядок сортировки
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список подписок получен
          schema:
            items:
              $ref: '#/definitions/subscription.SubscriptionResponseDTO'
            type: array
        "400":
          description: Неверные параметры запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Список подписок с фильтрацией
      tags:
      - subscriptions
    post:
      consumes:
      - application/json
      description: Создает новую запись о подписке пользователя.
      parameters:
      - description: Данные для создания подписки
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/subscription.SubscriptionCreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Подписка создана
          schema:
            $ref: '#/definitions/subscription.SubscriptionResponseDTO'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Создать новую подписку
      tags:
      - subscriptions
  /subscriptions/{id}:
    delete:
      consumes:
      - application/json
      description: Выполняет мягкое удаление записи о подписке по её ID
      parameters:
      - description: ID подписки (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Подписка удалена
        "400":
          description: Неверный ID подписки
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Подписка не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Удалить подписку
      tags:
      - subscriptions
    get:
      consumes:
      - application/json
      description: Возвращает информаци о подписке по её UUID.
      parameters:
      - description: ID подписки (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Подписка получена
          schema:
            $ref: '#/definitions/subscription.SubscriptionResponseDTO'
        "400":
          description: Неверный ID подписки
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Подписка не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить подписку по ID
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      description: Обновляет существующую запись о подписке по её ID
      parameters:
      - description: ID подписки (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления подписки
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/subscription.SubscriptionUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Подписка обновлена
          schema:
            $ref: '#/definitions/subscription.SubscriptionResponseDTO'
        "400":
          description: Неверное тело запроса или неверный ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Подписка не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Обновить подписку
      tags:
      - subscriptions
  /subscriptions/total:
    get:
      consumes:
      - application/json
      description: Рассчитывает общую стоимость всех подписок за указанный период
        с возможностью фильтрации по пользователю и названию сервиса
      parameters:
      - description: Дата начала периода (ММ-ГГГГ)
        in: query
        name: start_date
        required: true
        type: string
      - description: Дата окончания периода (ММ-ГГГГ)
        in: query
        name: end_date
        required: true
        type: string
      - description: Фильтр по ID пользователя (UUID)
        in: query
        name: user_id
        type: string
      - description: Фильтр по названию сервиса
        in: query
        name: service_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Общая стоимость подписок
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Неверные параметры запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить общую стоимость подписок
      tags:
      - subscriptions
swagger: "2.0"
